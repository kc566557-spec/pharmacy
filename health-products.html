<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Health Products | CarePlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="site-nav"></div>
    <section class="page-banner">
        <div class="container"><span>WELLNESS</span>
            <h1>Health Products</h1>
            <p>Essentials for your daily health routine.</p>
        </div>
    </section>
    <section class="section-padding">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="product-card">
                        <div class="product-icon">🧴</div>
                        <h4>Moisturizer</h4>
                        <p>Daily personal care.</p><strong>₹249</strong><button class="btn btn-primary w-100 mt-3"
                            onclick="showMessage('Moisturizer added to cart')">Add to Cart</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="product-card">
                        <div class="product-icon">🪥</div>
                        <h4>Oral Care Kit</h4>
                        <p>Everyday dental care.</p><strong>₹149</strong><button class="btn btn-primary w-100 mt-3"
                            onclick="showMessage('Oral Care Kit added to cart')">Add to Cart</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="product-card">
                        <div class="product-icon">🌡️</div>
                        <h4>Digital Thermometer</h4>
                        <p>Simple temperature monitoring.</p><strong>₹199</strong><button
                            class="btn btn-primary w-100 mt-3" onclick="showMessage('Thermometer added to cart')">Add to
                            Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="container">© 2026 CarePlus Pharmacy</div>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
