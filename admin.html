<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Admin Dashboard | CarePlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="site-nav"></div>
    <section class="section-padding">
        <div class="container">
            <div class="dashboard-head">
                <div><span class="badge-soft">FRONTEND DEMO</span>
                    <h1 class="mt-2">Admin Dashboard</h1>
                    <p>Management screens can be connected to a backend later.</p>
                </div><button class="btn btn-outline-danger rounded-pill" onclick="logout()">Logout</button>
            </div>
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="dash-card"><span>💊</span><b>128</b><small>Medicines</small></div>
                </div>
                <div class="col-md-3">
                    <div class="dash-card"><span>📦</span><b>42</b><small>Orders</small></div>
                </div>
                <div class="col-md-3">
                    <div class="dash-card"><span>👥</span><b>86</b><small>Customers</small></div>
                </div>
                <div class="col-md-3">
                    <div class="dash-card"><span>🎁</span><b>12</b><small>Offers</small></div>
                </div>
            </div>
            <div class="table-responsive mt-5">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Paracetamol 500mg</td>
                            <td>Medicine</td>
                            <td>₹25</td>
                            <td><span class="status">Active</span></td>
                        </tr>
                        <tr>
                            <td>Digital Thermometer</td>
                            <td>Health Device</td>
                            <td>₹199</td>
                            <td><span class="status">Active</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
    <script src="js/script.js"></script>
</body>

</html>
